<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сердце</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(circle at 50% 40%, #1b0b1a 0%, #08060a 70%);
    overflow: hidden;
    font-family: system-ui, sans-serif;
  }
  #scene { position: fixed; inset: 0; display: block; }

</style>
</head>
<body>
<canvas id="scene"></canvas>

<script>
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');

  const TAU = Math.PI * 2;
  const SAMPLES = 720;

  
  const curve = [];
  for (let i = 0; i <= SAMPLES; i++) {
    const t = (i / SAMPLES) * TAU;
    curve.push({
      x: 16 * Math.pow(Math.sin(t), 3),
      y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
    });
  }

 
  const coarse = curve.filter((_, i) => i % 6 === 0);

  const PALETTE = ['#ffd1e3', '#ff9ec4', '#ff77ab', '#ff416c', '#ffa2c4'];

  
  const TITLE_TEXT = 'я тебя люблю, ариша';
  const REASONS = [
    'за твою улыбку',
    'за то, как ты смеёшься',
    'за твою доброту',
    'за то, что ты рядом'
  ];

  const TITLE_COLORS = ['#ff416c', '#ff5c86', '#ff8fb0', '#ffb3c9', '#ffd1e3'];
  const FRAME_COLORS = ['#ffb3c9', '#ffc9dd', '#ffd1e3', '#ffe3ee', '#fff5f9'];

  // Пиксельный текст: строки растеризуются в офскрин-канвас 1:1 (1 ячейка = 1
  // пиксель шрифта), затем каждая залитая ячейка рисуется квадратом p x p.
  // Разрешение шрифта (fs) отвечает за разборчивость букв, p — за размер на экране.
  const mcv = document.createElement('canvas');
  const mctx = mcv.getContext('2d', { willReadFrequently: true });
  const fontOf = fs => '700 ' + fs + 'px Consolas, "Courier New", monospace';

  function wrapLines(text, fs, maxWidth) {
    mctx.font = fontOf(fs);
    const words = text.split(' ');
    const lines = [];
    let line = '';
    for (const w of words) {
      const next = line ? line + ' ' + w : w;
      if (line && mctx.measureText(next).width > maxWidth) { lines.push(line); line = w; }
      else line = next;
    }
    if (line) lines.push(line);
    return lines;
  }

  // Подбираем максимальный пиксель p, при котором текст влезает в availW x availH
  function measureFit(text, fs, p, availW, availH) {
    const lineH = Math.round(fs * 1.45);
    const cols = Math.floor(availW / p);
    const lines = wrapLines(text, fs, cols * p);
    let w = 1;
    for (const l of lines) w = Math.max(w, Math.ceil(mctx.measureText(l).width));
    if (w > cols) return null;
    if (lines.length * lineH > Math.floor(availH / p)) return null;
    return { lines: lines, w: w, h: lines.length * lineH, lineH: lineH };
  }

  function bestPixel(text, fs, availW, availH) {
    const top = Math.max(2, Math.min(Math.floor(availW / 8), Math.floor(availH / (fs * 1.45))));
    for (let p = top; p >= 2; p--) {
      if (measureFit(text, fs, p, availW, availH)) return p;
    }
    return 0;
  }

  // Общий пиксель для набора строк, чтобы все подписи были одного размера
  function sharedPixel(texts, fs, availW, availH) {
    let p = Infinity;
    for (const t of texts) p = Math.min(p, bestPixel(t, fs, availW, availH));
    return p;
  }

  // Пиксели букв делаем слегка хаотичными: своё смещение, размер, яркость,
  // цвет и фаза мерцания у каждого блока + редкие «выбившиеся» точки вокруг
  function jitterCell(c, r, p, colors, noise) {
    const spread = noise ? p : Math.max(1, Math.round(p * 0.45));
    return {
      c: c,
      r: r,
      dx: Math.round((Math.random() - 0.5) * spread),
      dy: Math.round((Math.random() - 0.5) * spread),
      size: noise ? 0.5 + Math.random() * 0.4 : 0.8 + Math.random() * 0.5,
      alpha: noise ? 0.12 + Math.random() * 0.3 : 0.6 + Math.random() * 0.4,
      color: colors[Math.floor(Math.random() * colors.length)],
      tw: Math.random() * Math.PI * 2,
      twSpeed: 0.5 + Math.random() * 2
    };
  }

  function raster(text, fs, p, availW, availH, colors) {
    const fit = measureFit(text, fs, p, availW, availH) || measureFit(text, fs, 2, availW * 3, availH * 3);
    const lines = fit.lines;
    const w = fit.w;
    const h = fit.h;

    mcv.width = w;
    mcv.height = h;
    mctx.font = fontOf(fs);
    mctx.textBaseline = 'top';
    mctx.fillStyle = '#fff';
    lines.forEach((l, i) => mctx.fillText(l, 0, i * fit.lineH + Math.round(fs * 0.18)));

    const d = mctx.getImageData(0, 0, w, h).data;
    const lit = [];
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        if (d[(y * w + x) * 4 + 3] > 110) lit.push([x, y]);
      }
    }
    if (!lit.length) return null;

    let minC = Infinity, maxC = -1, minR = Infinity, maxR = -1;
    for (const [c, r] of lit) {
      if (c < minC) minC = c;
      if (c > maxC) maxC = c;
      if (r < minR) minR = r;
      if (r > maxR) maxR = r;
    }
    const cols = maxC - minC + 1;
    const rows = maxR - minR + 1;

    const cells = lit.map(([c, r]) => jitterCell(c - minC, r - minR, p, colors, false));

    // Пиксельная пыль вокруг букв
    const dust = Math.round(lit.length * 0.07);
    for (let i = 0; i < dust; i++) {
      const src = lit[Math.floor(Math.random() * lit.length)];
      const ang = Math.random() * Math.PI * 2;
      const dist = 2 + Math.random() * 4;
      cells.push(jitterCell(
        src[0] - minC + Math.round(Math.cos(ang) * dist),
        src[1] - minR + Math.round(Math.sin(ang) * dist),
        p, colors, true
      ));
    }

    return {
      cells: cells,
      cols: cols,
      rows: rows,
      p: p,
      // зазор между пикселями, чтобы буквы не сливались в полосу
      dot: Math.max(1, p - (p >= 6 ? 2 : 1))
    };
  }

  // Перебор кегля от крупного к мелкому: первый, что влезает общим пикселем
  function fitText(texts, availW, availH, fsList, colors) {
    for (const fs of fsList) {
      const p = sharedPixel(texts, fs, availW, availH);
      if (p >= 3) {
        return texts.map(t => raster(t, fs, p, availW, availH, colors));
      }
    }
    const fs = fsList[fsList.length - 1];
    const p = Math.max(2, bestPixel(texts[0], fs, availW, availH));
    return texts.map(t => raster(t, fs, p, availW, availH, colors));
  }


  function borderCells(x, y, w, h, b) {
    const cols = Math.floor(w / b);
    const rows = Math.floor(h / b);
    if (cols < 3 || rows < 3) return [];

    const ox = x + (w - cols * b) / 2;
    const oy = y + (h - rows * b) / 2;
    const out = [];
    const total = 2 * cols + 2 * rows - 4;
    let k = 0;
    const push = (c, r) => out.push({ x: ox + c * b, y: oy + r * b, order: k++ / total });

    for (let c = 0; c < cols; c++) push(c, 0);
    for (let r = 1; r < rows; r++) push(cols - 1, r);
    for (let c = cols - 2; c >= 0; c--) push(c, rows - 1);
    for (let r = rows - 2; r >= 1; r--) push(0, r);
    return out;
  }

  const DRAW_MS = 2600;
  const HOLD_MS = 2200;
  const FADE_MS = 1400;

  const TITLE_IN_MS = 1100;
  const TITLE_HOLD_MS = 1200;
  const RISE_MS = 1500;

  const FRAME_DRAW_MS = 800;
  const FRAME_TEXT_MS = 700;
  const FRAME_STAGGER_MS = 400;

  // Дождь из маленьких пиксельных сердечек во время подъёма надписи
  const SPARK_COUNT = 160;
  const SPARK_COLORS = ['#ff416c', '#ff77ab', '#ff9ec4', '#ffd1e3', '#ffe3ee'];
  const HEART_SPRITE = [
    '..##.##..',
    '.#######.',
    '#########',
    '#########',
    '.#######.',
    '..#####..',
    '...###...',
    '....#....'
  ];
  const HEART_LIT = [];
  HEART_SPRITE.forEach((row, r) => {
    for (let c = 0; c < row.length; c++) if (row[c] === '#') HEART_LIT.push([c, r]);
  });

  const T_FADE = DRAW_MS + HOLD_MS;
  const T_TITLE = T_FADE + FADE_MS;
  const T_RISE = T_TITLE + TITLE_IN_MS + TITLE_HOLD_MS;
  const T_FRAMES = T_RISE + RISE_MS;

  let W = 0, H = 0, cx = 0, cy = 0, unit = 1, grid = 6;
  let pixels = [];

  function inHeart(x, y) {
    let inside = false;
    for (let i = 0, j = coarse.length - 1; i < coarse.length; j = i++) {
      const a = coarse[i], b = coarse[j];
      if ((a.y > y) !== (b.y > y) && x < ((b.x - a.x) * (y - a.y)) / (b.y - a.y) + a.x) inside = !inside;
    }
    return inside;
  }

 
  function nearestOutline(x, y) {
    let best = Infinity, idx = 0;
    for (let i = 0; i <= SAMPLES; i += 3) {
      const dx = curve[i].x - x, dy = curve[i].y - y;
      const d = dx * dx + dy * dy;
      if (d < best) { best = d; idx = i; }
    }
    return { d2: best, order: idx / SAMPLES };
  }

  function buildPixels() {
    pixels = [];
    grid = Math.max(5, Math.round(Math.min(W, H) / 105));
    const step = grid / unit;
    const cells = Math.ceil(19 / step);
    const edgeR2 = Math.pow(step * 1.7, 2);

    for (let ky = -cells; ky <= cells; ky++) {
      for (let kx = -cells; kx <= cells; kx++) {
        const x = kx * step, y = ky * step;
        if (!inHeart(x, y)) continue;

        const near = nearestOutline(x, y);
        const edge = near.d2 < edgeR2;
        if (!edge && Math.random() > 0.55) continue;

        const angle = Math.atan2(y, x);
        pixels.push({
          x: x,
          y: y,
          color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
          alpha: edge ? 0.85 + Math.random() * 0.15 : 0.25 + Math.random() * 0.45,
          size: edge ? 1 : (Math.random() < 0.7 ? 0.6 : 0.85),
          order: near.order,
          tw: Math.random() * TAU,
          twSpeed: 1 + Math.random() * 2,
          delay: Math.random(),
          vx: Math.cos(angle) * (20 + Math.random() * 120),
          vy: Math.sin(angle) * (20 + Math.random() * 120) - 90
        });
      }
    }
    pixels.sort((a, b) => a.order - b.order);
  }

  let title = null;
  let frames = [];
  let sparks = [];

  // Позиция надписи в момент t (мс от начала подъёма) — нужна, чтобы сердечки
  // вылетали прямо из букв
  function titleYAt(t) {
    return title.yCenter + (title.yTop - title.yCenter) * easeInOut(clamp01(t / RISE_MS));
  }

  function buildSparks() {
    sparks = [];
    const small = Math.max(2, Math.round(Math.min(W, H) / 330));
    const big = Math.max(3, Math.round(Math.min(W, H) / 190));

    for (let i = 0; i < SPARK_COUNT; i++) {
      const fromText = i % 3 === 0;
      const t0 = Math.random() * RISE_MS * 0.7;
      const tw = title.cols * title.p;

      sparks.push({
        t0: t0,
        life: 1600 + Math.random() * 1400,
        x: fromText ? title.x + Math.random() * tw : Math.random() * W,
        y: fromText
          ? titleYAt(t0) + (Math.random() - 0.5) * title.rows * title.p * 1.6
          : H * (0.5 + Math.random() * 0.55),
        vy: -(55 + Math.random() * 150),
        sway: 6 + Math.random() * 26,
        swaySpeed: 0.8 + Math.random() * 1.8,
        phase: Math.random() * TAU,
        cell: Math.random() < 0.2 ? big : small,
        color: SPARK_COLORS[Math.floor(Math.random() * SPARK_COLORS.length)],
        alpha: 0.45 + Math.random() * 0.55
      });
    }
  }


  function buildLayout() {
    const pad = Math.round(Math.min(W, H) * 0.035);

    const titleH = Math.max(40, H * 0.16);
    title = fitText([TITLE_TEXT], W - pad * 2, titleH, [26, 22, 18, 15, 12, 10], TITLE_COLORS)[0];
    title.x = cx - (title.cols * title.p) / 2;
    title.yCenter = cy - (title.rows * title.p) / 2;
    title.yTop = pad;

    const top = pad + title.rows * title.p + pad;
    const cols = (W >= 720 && H >= 520) ? 2 : 1;
    const rows = Math.ceil(REASONS.length / cols);
    const fw = (W - pad * (cols + 1)) / cols;
    const fh = (H - top - pad * (rows + 1)) / rows;
    const b = Math.max(2, Math.round(Math.min(fw, fh) / 90));

    const inner = b * 5;
    const texts = fitText(REASONS, fw - inner * 2, fh - inner * 2, [22, 19, 16, 14, 12, 10, 9], FRAME_COLORS);

    frames = REASONS.map((text, i) => {
      const fx = pad + (i % cols) * (fw + pad);
      const fy = top + Math.floor(i / cols) * (fh + pad);
      const t = texts[i];
      return {
        border: borderCells(fx, fy, fw, fh, b),
        b: b,
        text: t,
        tx: fx + (fw - t.cols * t.p) / 2,
        ty: fy + (fh - t.rows * t.p) / 2
      };
    });
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2;
    cy = H / 2 - H * 0.03;
    unit = Math.min(W, H) / 45;
    buildPixels();
    buildLayout();
    buildSparks();
  }

  
  function heartbeat(t) {
    const p = (t % 1.5) / 1.5;
    const thump = (center, width, amp) => amp * Math.exp(-Math.pow((p - center) / width, 2));
    return 1 + thump(0.08, 0.05, 0.09) + thump(0.3, 0.06, 0.05);
  }

  const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
  const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

  let start = performance.now();

  window.addEventListener('resize', resize);
  resize();

  function drawHeart(now, elapsed) {
    const drawn = Math.min(elapsed / DRAW_MS, 1);
    const progress = 1 - Math.pow(1 - drawn, 3);
    const fading = elapsed > T_FADE;
    const f = fading ? Math.min((elapsed - T_FADE) / FADE_MS, 1) : 0;
    const beat = elapsed > DRAW_MS && !fading ? heartbeat((elapsed - DRAW_MS) / 1000) : 1;

    if (progress > 0.6 && f < 1) {
      const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, unit * 20 * beat);
      glow.addColorStop(0, 'rgba(255, 65, 108, ' + (0.35 * (1 - f)).toFixed(3) + ')');
      glow.addColorStop(1, 'rgba(120, 0, 40, 0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, W, H);
    }

    for (let i = 0; i < pixels.length; i++) {
      const p = pixels[i];
      let alpha, ox = 0, oy = 0, sx, sy;

      if (fading) {
        const local = clamp01((f - p.delay * 0.5) / 0.5);
        ox = p.vx * local * local;
        oy = p.vy * local * local;
        alpha = p.alpha * (1 - local);
        if (alpha <= 0.01) continue;
      } else {
        const reveal = (progress - p.order) / 0.015;
        if (reveal <= 0) continue;
        alpha = p.alpha * Math.min(reveal, 1);
      }

      alpha *= 0.8 + 0.2 * Math.sin(now / 1000 * p.twSpeed + p.tw);

      sx = cx + p.x * unit * beat + ox;
      sy = cy + p.y * unit * beat + oy;
      if (!fading) {
        sx = Math.round(sx / grid) * grid;
        sy = Math.round(sy / grid) * grid;
      }

      const s = Math.max(2, Math.round(grid * p.size));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.fillRect(sx - (s >> 1), sy - (s >> 1), s, s);
    }
    ctx.globalAlpha = 1;

    if (!drawn) {
      const p = curve[Math.round(SAMPLES * progress)];
      ctx.save();
      ctx.fillStyle = '#fff';
      ctx.shadowColor = '#ff416c';
      ctx.shadowBlur = 25;
      const s = grid * 1.6;
      ctx.fillRect(cx + p.x * unit - (s >> 1), cy + p.y * unit - (s >> 1), s, s);
      ctx.restore();
    }
  }


  function drawTitle(now, elapsed) {
    const reveal = clamp01((elapsed - T_TITLE) / TITLE_IN_MS);
    const rise = easeInOut(clamp01((elapsed - T_RISE) / RISE_MS));
    const y = title.yCenter + (title.yTop - title.yCenter) * rise;
    const maxCol = reveal * title.cols;

    for (const cell of title.cells) {
      if (cell.c > maxCol) continue;
      ctx.globalAlpha = cell.alpha * (0.75 + 0.25 * Math.sin(now / 620 * cell.twSpeed + cell.tw));
      ctx.fillStyle = cell.color;
      const s = Math.max(1, Math.round(title.dot * cell.size));
      ctx.fillRect(title.x + cell.c * title.p + cell.dx, y + cell.r * title.p + cell.dy, s, s);
    }
    ctx.globalAlpha = 1;
  }

  function drawSparks(elapsed) {
    for (let i = 0; i < sparks.length; i++) {
      const s = sparks[i];
      const t = elapsed - T_RISE - s.t0;
      if (t < 0 || t > s.life) continue;

      const k = t / s.life;
      // плавное появление и затухание
      const fade = s.alpha * Math.min(1, k / 0.15) * (1 - k * k);
      if (fade <= 0.01) continue;

      const x = s.x + Math.sin(t / 1000 * s.swaySpeed + s.phase) * s.sway;
      const y = s.y + s.vy * (t / 1000);
      const c = s.cell;
      const dot = Math.max(1, c - 1);

      ctx.globalAlpha = fade;
      ctx.fillStyle = s.color;
      for (let n = 0; n < HEART_LIT.length; n++) {
        const cell = HEART_LIT[n];
        ctx.fillRect(x + cell[0] * c, y + cell[1] * c, dot, dot);
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawFrames(now, elapsed) {
    for (let i = 0; i < frames.length; i++) {
      const fr = frames[i];
      const local = elapsed - T_FRAMES - i * FRAME_STAGGER_MS;
      if (local <= 0) continue;

      const border = clamp01(local / FRAME_DRAW_MS);
      ctx.fillStyle = '#ff416c';
      ctx.globalAlpha = 0.9;
      for (const b of fr.border) {
        if (b.order <= border) ctx.fillRect(b.x, b.y, fr.b, fr.b);
      }

      const text = clamp01((local - FRAME_DRAW_MS * 0.5) / FRAME_TEXT_MS);
      if (text > 0) {
        const t = fr.text;
        const maxRow = text * t.rows;

        for (const cell of t.cells) {
          if (cell.r > maxRow) continue;
          ctx.globalAlpha = cell.alpha * (0.75 + 0.25 * Math.sin(now / 620 * cell.twSpeed + cell.tw));
          ctx.fillStyle = cell.color;
          const s = Math.max(1, Math.round(t.dot * cell.size));
          ctx.fillRect(fr.tx + cell.c * t.p + cell.dx, fr.ty + cell.r * t.p + cell.dy, s, s);
        }
      }
      ctx.globalAlpha = 1;
    }
  }

  function frame(now) {
    const elapsed = now - start;
    ctx.clearRect(0, 0, W, H);

    if (elapsed < T_TITLE) drawHeart(now, elapsed);
    if (elapsed > T_TITLE) drawTitle(now, elapsed);
    if (elapsed > T_RISE) drawSparks(elapsed);
    if (elapsed > T_FRAMES) drawFrames(now, elapsed);

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
</script>
</body>
</html>
